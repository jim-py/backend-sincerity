# Insert ONLY inside the EXISTING TLS server for api.productivumtesting.ru.
# Inspect and back up its symlink target first. Do not replace the server block.
# Existing location / -> 127.0.0.1:3011, certificates and Certbot rules stay in place.
location ^~ /ai/ {
    proxy_pass http://127.0.0.1:3012;
    # No trailing slash: the upstream receives /ai/... unchanged.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 32k;
    client_body_timeout 30s;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    # Default max: 120s queue + 2*(600s load + 300s generation) + 10s margin.
    proxy_read_timeout 2000s;
    proxy_buffering off;
    proxy_cache off;
    proxy_next_upstream off;
    # Suppress URI/query logging (source names) and request-body debug logging.
    access_log off;
}
